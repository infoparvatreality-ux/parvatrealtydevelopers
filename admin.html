<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parvat Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans">
    <div id="admin-dashboard" class="min-h-screen flex flex-col">
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-slate-800">Parvat Reality Admin Portal</h1>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm text-slate-600 font-medium">admin@parvatrealty.com</span>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm mb-6">
                <h2 class="text-lg font-bold text-slate-800 mb-2">Welcome to your Dashboard</h2>
                <p class="text-slate-600 text-sm">यहाँ से आप सीधे वेबसाइट के प्रोजेक्ट्स और न्यूज़ अपडेट कर सकते हैं।</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                    <h3 class="font-bold text-slate-800 mb-4 text-base">➕ Add New Project</h3>
                    <div class="space-y-4">
                        <input type="text" placeholder="Project Name" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
                        <button class="w-full bg-blue-600 text-white py-2 rounded-lg">Save Project</button>
                    </div>
                </div>

                <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
                    <h3 class="font-bold text-slate-800 mb-4 text-base">📰 Update News</h3>
                    <div class="space-y-4">
                        <input type="text" placeholder="News Title" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
                        <button class="w-full bg-emerald-600 text-white py-2 rounded-lg">Publish News</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
