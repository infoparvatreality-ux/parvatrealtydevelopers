<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="theme.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Parvat Reality</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex flex-col justify-between antialiased">

    <!-- Top Navigation Link -->
    <header class="p-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-slate-600 hover:text-blue-600 transition-colors duration-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Website
            </a>
        </div>
    </header>

    <!-- Main Card Container -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-2xl border border-slate-100 shadow-2xl space-y-8 relative overflow-hidden">
            
            <!-- Branding & Title -->
            <div class="text-center space-y-3">
                <div class="inline-flex w-12 h-12 bg-blue-50 text-blue-600 rounded-xl items-center justify-center text-2xl font-black border border-blue-100 shadow-sm">
                    P
                </div>
                <div class="space-y-1">
                    <h2 class="text-xs font-black tracking-[0.2em] text-slate-400 uppercase">PARVAT REALITY</h2>
                    <h1 class="text-2xl font-black tracking-tight text-slate-900">Sign in to your account</h1>
                    <p class="text-xs text-slate-500">Welcome back! Please enter your details to login.</p>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleEmailSignIn(event)" class="space-y-5">
                
                <!-- Email Input -->
                <div class="space-y-1.5">
                    <label for="email" class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                            </svg>
                        </span>
                        <input type="email" id="email" required placeholder="name@company.com" class="w-full bg-slate-50/50 border border-slate-200 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 text-slate-900 rounded-xl pl-10 pr-4 py-3 text-xs outline-none transition-all placeholder:text-slate-400">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label for="password" class="block text-[10px] font-bold text-slate-700 uppercase tracking-wider">Password</label>
                        <a href="#" onclick="alert('Password reset link has been simulated. Check console or set up Firebase Authentication Reset.')" class="text-[10px] font-semibold text-blue-600 hover:text-blue-800 transition-colors uppercase tracking-wider">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50/50 border border-slate-200 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 text-slate-900 rounded-xl pl-10 pr-10 py-3 text-xs outline-none transition-all placeholder:text-slate-400">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 transition-colors">
                            <svg id="password-toggle-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me checkbox -->
                <div class="flex items-center">
                    <input id="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-xs text-slate-500 select-none cursor-pointer">
                        Keep me signed in on this device
                    </label>
                </div>

                <!-- Sign In Button -->
                <button type="submit" id="submit-btn" class="w-full flex items-center justify-center gap-2 px-5 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs tracking-wider uppercase rounded-xl shadow-md hover:shadow-lg transition-all duration-200 cursor-pointer">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-100"></div>
                <span class="flex-shrink mx-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Or continue with</span>
                <div class="flex-grow border-t border-slate-100"></div>
            </div>

            <!-- Google Login Button -->
            <button id="google-signin-btn" class="w-full flex items-center justify-center gap-3 px-5 py-3.5 bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 font-bold text-xs tracking-wider uppercase rounded-xl shadow-sm hover:shadow-md transition-all duration-200 cursor-pointer">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5.04c1.66 0 3.2.57 4.38 1.69l3.27-3.27C17.67 1.54 15.01 0 12 0 7.31 0 3.25 2.69 1.25 6.63l3.87 3C6.06 6.88 8.81 5.04 12 5.04z"/>
                    <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.36H12v4.51h6.46c-.29 1.48-1.14 2.73-2.4 3.58l3.72 2.88c2.18-2.01 3.71-4.97 3.71-8.61z"/>
                    <path fill="#FBBC05" d="M5.12 14.37c-.24-.72-.37-1.5-.37-2.37s.13-1.65.37-2.37V6.63H1.25C.45 8.24 0 10.06 0 12s.45 3.76 1.25 5.37l3.87-3z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.97-1.07 7.96-2.91l-3.72-2.88c-1.04.7-2.38 1.11-4.24 1.11-3.19 0-5.94-1.84-6.88-4.59l-3.87 3C3.25 21.31 7.31 24 12 24z"/>
                </svg>
                Sign in with Google
            </button>

            <!-- Sign Up Prompt -->
            <p class="text-center text-xs text-slate-500">
                Don't have an account? 
                <a href="contact.html" class="font-semibold text-blue-600 hover:text-blue-800 transition-colors">Contact sales representative</a>
            </p>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 border-t border-slate-100">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-[10px] font-medium text-slate-400 uppercase tracking-widest">© 2026 Parvat Reality & Developers. All rights reserved.</p>
        </div>
    </footer>

    <!-- Password visibility toggler helper -->
    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                `;
            } else {
                pwdInput.type = 'password';
                toggleIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        }
    </script>

    <!-- Direct Client-Side Admin Authentication -->
    <script>
        const submitBtn = document.getElementById('submit-btn');
        const googleSigninBtn = document.getElementById('google-signin-btn');

        // Handle Email & Password Sign-In
        window.handleEmailSignIn = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `
                    <svg class="animate-spin h-4 w-4 text-white inline mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Verifying...
                `;

                // Verify the credentials directly against the authorized administrator credentials in frontend JS state
                if (email === "admin@parvatreality.com" && password === "admin123") {
                    // Store secure local session for admin
                    sessionStorage.setItem('parvat_admin_session', JSON.stringify({
                        email: "admin@parvatreality.com",
                        displayName: "Parvat Admin",
                        token: "secure_admin_session_token_998877"
                    }));

                    // Redirect on success
                    window.location.href = 'admin.html';
                } else {
                    throw new Error("Invalid admin email or password");
                }
            } catch (error) {
                console.error("Email sign-in error:", error);
                alert("Authentication failed: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Sign In";
            }
        };

        // Handle Google Sign-In as alternative mock link
        if (googleSigninBtn) {
            googleSigninBtn.addEventListener('click', () => {
                alert("Direct administrator login required. Please use the email and password form.");
            });
        }

        // Auto redirect to admin if already authenticated
        if (sessionStorage.getItem('parvat_admin_session')) {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
